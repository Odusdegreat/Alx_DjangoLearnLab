<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List of Books</title>
    <!-- You can add some styling to enhance the look -->
  </head>
  <body>
    <h1>Books Available:</h1>
    <ul>
      {% for book in books %}
      <li>
        <strong>{{ book.title }}</strong> by <em>{{ book.author.name }}</em>
      </li>
      <!-- Display each book's title and author -->
      {% endfor %}
    </ul>
  </body>
</html>
